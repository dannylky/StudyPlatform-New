// HanziWriter 動態加載器
let scriptPromise = null;
const loadHanziWriter = () => {
  if (window.HanziWriter) return Promise.resolve(window.HanziWriter);
  if (scriptPromise) return scriptPromise;
  scriptPromise = new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js';
    script.onload = () => resolve(window.HanziWriter);
    script.onerror = reject;
    document.head.appendChild(script);
  });
  return scriptPromise;
};

// 中文斷詞工具
const segmentChineseText = (text) => {
  try {
    if (window.Intl && window.Intl.Segmenter) {
      const segmenter = new Intl.Segmenter('zh-Hant', { granularity: 'word' });
      return Array.from(segmenter.segment(text)).map(s => s.segment);
    }
  } catch(e) {}
  return text.split(/(?=[\u4e00-\u9fa5])/);
};

// 語音引擎封裝（瀏覽器內建語音，無需 API）
const getVoiceUtterance = (text, rate, forceEnglish = false, appLanguage = 'yue') => {
  if (!('speechSynthesis' in window)) return null;
  const utterance = new SpeechSynthesisUtterance(text);
  const voices = window.speechSynthesis.getVoices();
  const normalizedLang = (v) => String(v.lang || '').toLowerCase().replace('_', '-');
  const preferFemale = (pool) => {
    if (!pool || pool.length === 0) return null;
    const f = pool.find(v => v.name.toLowerCase().match(/(female|samantha|zira|victoria|karen|sin-ji|ting-ting|yaoyao|huihui|tracy|xiaoxiao|mei-jia|meijia)/));
    if (f) return f;
    const nf = pool.filter(v => !v.name.toLowerCase().match(/(male|boy|david|alex|daniel)/));
    return nf.length > 0 ? nf[0] : pool[0];
  };
  const isZh = (v) => normalizedLang(v).startsWith('zh') || /cmn|chinese|mandarin|粵|粤|普通話|普通话|國語/i.test(v.lang + ' ' + v.name);
  const isYue = (v) => /yue|zh-hk|cantonese|粵|粤|廣東|广东/i.test(v.lang + ' ' + v.name) && !normalizedLang(v).startsWith('en');
  const isMandarin = (v) => /zh-cn|zh-tw|zh-sg|cmn|mandarin|chinese|普通話|普通话|國語/i.test(v.lang + ' ' + v.name) && !normalizedLang(v).startsWith('en');

  let selectedVoice = null;
  let selectedLang = 'zh-HK';

  if (forceEnglish) {
    selectedVoice = preferFemale(voices.filter(v => normalizedLang(v).startsWith('en')));
    selectedLang = selectedVoice?.lang || 'en-US';
  } else {
    const targetLang = appLanguage === 'zh-CN' ? 'zh-CN' : appLanguage === 'zh-TW' ? 'zh-TW' : 'zh-HK';
    let pool = [];
    if (appLanguage === 'yue') {
      pool = voices.filter(isYue);
      if (pool.length === 0) pool = voices.filter(isZh);
    } else if (appLanguage === 'zh-CN') {
      pool = voices.filter(v => normalizedLang(v).startsWith('zh-cn') || /mandarin|普通話|普通话/i.test(v.lang + ' ' + v.name));
      if (pool.length === 0) pool = voices.filter(isMandarin);
    } else {
      pool = voices.filter(v => normalizedLang(v).startsWith('zh-tw') || /國語|普通話|普通话|mandarin/i.test(v.lang + ' ' + v.name));
      if (pool.length === 0) pool = voices.filter(isMandarin);
    }
    if (pool.length === 0) pool = voices.filter(isZh);
    selectedVoice = preferFemale(pool);
    selectedLang = selectedVoice?.lang || targetLang;
  }

  if (selectedVoice) utterance.voice = selectedVoice;
  utterance.lang = selectedLang;
  utterance.rate = rate;
  return utterance;
};

const BlankInput = memo(({ id, value, onChange, answer, showAnswer, individualReveals, onToggleReveal }) => {
  const minW = Math.max(answer.length * 1.5, 4) + 'em';
  const isRevealed = showAnswer || (individualReveals && individualReveals[id]);
  return (
    <span className="relative inline-block mx-1 align-middle whitespace-nowrap group">
      <input 
        type="text" 
        style={{ width: minW }} 
        className={`border-b-2 bg-transparent text-center focus:outline-none focus:border-indigo-500 transition-colors pr-6 ${isRevealed ? 'border-emerald-300 text-transparent' : 'border-slate-400 text-slate-800 font-bold'}`} 
        value={value || ''} 
        onChange={(e) => onChange(id, e.target.value)} 
        disabled={isRevealed} 
      />
      {isRevealed && (
        <span className="absolute left-0 top-0 w-full pr-6 text-center text-emerald-600 font-bold pointer-events-none drop-shadow-sm h-full flex items-center justify-center">
          {answer}
        </span>
      )}
      {!showAnswer && (
        <button 
          onClick={(e) => { e.preventDefault(); onToggleReveal(id); }} 
          className={`absolute right-0 top-1/2 -translate-y-1/2 p-1 transition-all outline-none ${individualReveals && individualReveals[id] ? 'text-emerald-500 hover:text-slate-400 opacity-100' : 'text-slate-400 hover:text-amber-500 opacity-70 hover:opacity-100'}`} 
          title="提示答案">
          <HelpCircle size={14} />
        </button>
      )}
    </span>
  );
});

const CharacterBox = memo(({ charItem, isPlaying, charIdx, isHidden }) => {
  const containerRef = useRef(null);
  const writerRef = useRef(null);
  const [isLoaded, setIsLoaded] = useState(false);

  const getBoxSize = () => {
    if (typeof window === 'undefined') return 44;
    if (window.innerWidth >= 1024) return 88;
    if (window.innerWidth >= 768) return 72;
    if (window.innerWidth >= 640) return 64;
    return 44; 
  };

  useEffect(() => {
    let isMounted = true;
    if (isHidden) return; 
    const boxSize = getBoxSize();
    loadHanziWriter().then(HanziWriter => {
      if (!isMounted || !containerRef.current) return;
      if (writerRef.current) containerRef.current.innerHTML = '';
      const currentSpeed = window.__speechSpeed || 0.6;
      writerRef.current = HanziWriter.create(containerRef.current, charItem.c, { 
        width: boxSize - 10, height: boxSize - 10, padding: 5, 
        strokeAnimationSpeed: 0.8 * currentSpeed, delayBetweenStrokes: 150 / currentSpeed, 
        strokeColor: '#000000', radicalColor: '#f43f5e', outlineColor: '#e2e8f0', showOutline: true, 
        onLoadCharDataSuccess: () => { if (isMounted) setIsLoaded(true); }, 
        onLoadCharDataError: () => { if (isMounted) setIsLoaded(false); } 
      });
    }).catch(err => console.error("HanziWriter failed to load", err));
    return () => { isMounted = false; };
  }, [charItem.c, isHidden]);

  useEffect(() => {
    if (isPlaying && writerRef.current && isLoaded && !isHidden) {
      writerRef.current.hideCharacter();
      const currentSpeed = window.__speechSpeed || 0.6;
      setTimeout(() => { if (writerRef.current) writerRef.current.animateCharacter(); }, charIdx * (800 / currentSpeed));
    }
  }, [isPlaying, charIdx, isLoaded, isHidden]);

  return (
    <div className="flex flex-col items-center">
      <span className="text-indigo-600 text-[10px] sm:text-sm md:text-lg font-bold mb-0.5 sm:mb-1 h-3.5 sm:h-6 tracking-wide drop-shadow-sm leading-none">
        {!isHidden ? charItem.p : ''}
      </span>
      <div className={`flex items-center justify-center w-[44px] h-[44px] sm:w-16 sm:h-16 md:w-20 md:h-20 lg:w-24 lg:h-24 border-2 rounded-xl relative shadow-sm transition-colors ${isPlaying ? 'bg-indigo-50 border-indigo-300' : 'bg-white/95 border-slate-200'}`}>
        <div className="absolute inset-0 border-b-2 border-dashed border-slate-200 top-1/2 w-full -translate-y-px z-0"></div>
        <div className="absolute inset-0 border-r-2 border-dashed border-slate-200 left-1/2 h-full -translate-x-px z-0"></div>
        <div ref={containerRef} className={`relative z-10 w-full h-full flex items-center justify-center ${!isLoaded || isHidden ? 'invisible' : 'visible'}`} />
        {!isLoaded && !isHidden && <span className="absolute z-20 text-2xl sm:text-3xl md:text-5xl lg:text-7xl font-serif text-slate-800">{charItem.c}</span>}
        {isHidden && <span className="absolute z-20 text-2xl sm:text-3xl md:text-5xl lg:text-7xl font-serif text-slate-300">?</span>}
      </div>
    </div>
  );
});

          {item.chars.map((c, ci) => (<div key={ci} className={item.chars.length === 3 && ci === 2 ? 'col-span-2' : ''}><CharacterBox charItem={c} isPlaying={isPlaying} charIdx={ci} isHidden={isHidden} /></div>))}
        </div>

          <span className={`${textSizeClass} font-extrabold text-slate-800 tracking-tight text-center px-2 break-words leading-tight`}>{isHidden ? '???' : item.word}</span>
        </div>
      )}
      <div className="mt-auto flex items-center justify-center gap-1.5 sm:gap-3 pt-3 sm:pt-6 border-t border-slate-100 relative z-10 pointer-events-none">
        <Volume2 className={`w-4 h-4 sm:w-5 sm:h-5 ${isPlaying ? 'text-indigo-600 animate-pulse' : isPracticeActiveCard ? 'text-amber-500 animate-pulse' : 'text-slate-400 group-hover:text-indigo-500'}`} />
        <span className="font-extrabold text-sm sm:text-base md:text-xl text-slate-700">
          {isHidden ? '???' : (isEnglishSubject ? item.translation : (language === 'en' ? item.word : item.translation))}
        </span>
      </div>
    </div>
  );
});

  const [selectedLogMonth, setSelectedLogMonth] = useState('');
  
  // --- 課文朗讀狀態 ---
  const [readingChapter, setReadingChapter] = useState(null);
  const [readSentences, setReadSentences] = useState([]);
  const [currentReadIndex, setCurrentReadIndex] = useState(-1);
  const [activeWordIndex, setActiveWordIndex] = useState(null); 
  const [readingMode, setReadingMode] = useState('word');
  const [isPaused, setIsPaused] = useState(false);
  const [speechSpeed, setSpeechSpeed] = useState(0.6);
  const [chapterRepeatTimes, setChapterRepeatTimes] = useState(1);
  const [currentReadingRound, setCurrentReadingRound] = useState(1);
  const [isChapterReadingActive, setIsChapterReadingActive] = useState(false);
  
  const speedRef = useRef(speechSpeed);
  const isReadingRef = useRef(false);
  const activeSentenceRef = useRef(null);
  const currentReadIndexRef = useRef(-1);
  const readSentencesRef = useRef([]);
  const chapterRepeatTimesRef = useRef(1);
  const currentChapterRepeatCountRef = useRef(0);

  // --- 章節練習狀態 ---
  const [isChapterPracticeOpen, setIsChapterPracticeOpen] = useState(false);
  const [activePracticeTab, setActivePracticeTab] = useState(0);
  const [practiceInputs, setPracticeInputs] = useState({});
  const [showPracticeAnswers, setShowPracticeAnswers] = useState(false);
  const [individualReveals, setIndividualReveals] = useState({});
  const [shuffledOptions, setShuffledOptions] = useState({});

  // --- 單字抽查模式狀態 ---
  const [isPracticeModalOpen, setIsPracticeModalOpen] = useState(false);
  const [practiceType, setPracticeType] = useState('standard');
  const [practiceRangeStart, setPracticeRangeStart] = useState(1);
  const [practiceRangeEnd, setPracticeRangeEnd] = useState(1);
  const [practiceOrder, setPracticeOrder] = useState('random'); 
  const [practiceWaitTime, setPracticeWaitTime] = useState(5); 
  const [practiceRepeatTimes, setPracticeRepeatTimes] = useState(2); 
  const [practiceSessionRounds, setPracticeSessionRounds] = useState(1); 
  const [practiceMode, setPracticeMode] = useState({
    isActive: false, isDictation: false, revealedWords: [], originalWords: [], words: [], currentIndex: 0, countdown: 5, currentRound: 1, totalRounds: 1
  });
  const practiceTimerRef = useRef(null);



  const toggleReveal = useCallback((id) => { setIndividualReveals(prev => ({...prev, [id]: !prev[id]})); }, []);

  // --- 初始化與事件監聽 ---
  const toggleCardSelection = useCallback((index) => {
    setSelectedCardIndices(prev => prev.includes(index) ? prev.filter(i => i !== index) : [...prev, index]);
  }, []);

  useEffect(() => { setSelectedCardIndices([]); }, [currentChapter]);

  useEffect(() => {
    setActivePracticeTab(0); setPracticeInputs({}); setShowPracticeAnswers(false); setIndividualReveals({});
    if (isChapterPracticeOpen && PRACTICE_DB[currentChapter]) {
      const practiceList = Array.isArray(PRACTICE_DB[currentChapter]) ? PRACTICE_DB[currentChapter] : [PRACTICE_DB[currentChapter]];
      const newShuffled = {};
      practiceList.forEach((p, pIdx) => {
        if (p.type === 'mixed_qa') {
          p.sections.forEach((sec, sIdx) => {
            if (sec.questions) { sec.questions.forEach((qItem, qIdx) => { if (qItem.options) newShuffled[`qa-${pIdx}-${sIdx}-${qIdx}`] = [...qItem.options].sort(() => Math.random() - 0.5); }); }
            if (sec.options) newShuffled[`mc-${pIdx}-${sIdx}`] = [...sec.options].sort(() => Math.random() - 0.5);
            if (sec.sentenceMaking && sec.sentenceMaking.options) newShuffled[`sm-${pIdx}-${sIdx}`] = [...sec.sentenceMaking.options].sort(() => Math.random() - 0.5);
          });
        }
      });
      setShuffledOptions(newShuffled);
    }
  }, [currentChapter, isChapterPracticeOpen]);

  const handleDownloadSource = useCallback(() => {
    const sourceContent = `/* 粵語詞彙練習 (Cantonese Vocabulary Practice) Version: ${APP_VERSION} */\nconst APP_VERSION = "${APP_VERSION}";\nconst PROFILES = ${JSON.stringify(PROFILES, null, 2)};\nconst CHANGELOG_DATA = ${JSON.stringify(CHANGELOG_DATA, null, 2)};\nconst VOCABULARY_DB = ${JSON.stringify(VOCABULARY_DB, null, 2)};\nconst CHAPTERS = ${JSON.stringify(CHAPTERS, null, 2)};\nconst PRACTICE_DB = ${JSON.stringify(PRACTICE_DB, null, 2)};\n`;
    const blob = new Blob([sourceContent], { type: 'text/javascript;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a'); link.href = url; link.download = `Cantonese_Vocab_App_Data_${APP_VERSION}.js`;
    document.body.appendChild(link); link.click(); document.body.removeChild(link); URL.revokeObjectURL(url);
    showToast('已下載系統資料庫備份！', 4000);
  }, []);

  const logMonths = [...new Set(CHANGELOG_DATA.map(log => log.date.substring(0, 7)))].sort().reverse();
  const currentLogMonth = selectedLogMonth || logMonths[0];
  const filteredLogs = CHANGELOG_DATA.filter(log => log.date.startsWith(currentLogMonth));

  useEffect(() => {
    const closeTooltip = () => setHomophoneTooltip(null);
    window.addEventListener('click', closeTooltip); window.addEventListener('scroll', closeTooltip, true); 
    return () => { window.removeEventListener('click', closeTooltip); window.removeEventListener('scroll', closeTooltip, true); };
  }, []);

  const spawnParticles = useCallback((e, symbols) => {
    if (!e) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const x = (e.clientX || (e.touches && e.touches[0].clientX)) || rect.left + rect.width / 2;
    const y = (e.clientY || (e.touches && e.touches[0].clientY)) || rect.top + rect.height / 2;
    const newParticles = Array.from({ length: 4 }).map(() => ({ id: Math.random().toString(36).substr(2, 9), x, y, symbol: symbols[Math.floor(Math.random() * symbols.length)], tx: (Math.random() - 0.5) * 120, ty: -50 - Math.random() * 80, rot: (Math.random() - 0.5) * 90 }));
    setParticles(prev => [...prev, ...newParticles]); setTimeout(() => { setParticles(prev => prev.filter(p => !newParticles.find(np => np.id === p.id))); }, 800);
  }, []);

  useEffect(() => { setPracticeRangeStart(1); setPracticeRangeEnd(currentVocabulary.length > 0 ? currentVocabulary.length : 1); }, [currentChapter, currentVocabulary.length]);

  const handleProfileChange = useCallback((newProfile) => {
    setCurrentProfile(newProfile);
    const newChapters = CHAPTERS[newProfile]?.filter(ch => ch.subject === currentSubject) || [];
    setCurrentChapter(newChapters.length > 0 ? newChapters[0].id : '');
  }, [currentSubject]);

  const handleSubjectChange = useCallback((newSubject) => {
    setCurrentSubject(newSubject);
    const newChapters = CHAPTERS[currentProfile]?.filter(ch => ch.subject === newSubject) || [];
    setCurrentChapter(newChapters.length > 0 ? newChapters[0].id : '');
  }, [currentProfile]);

  useEffect(() => { if (activeSentenceRef.current) activeSentenceRef.current.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, [currentReadIndex]);
  useEffect(() => { speedRef.current = speechSpeed; }, [speechSpeed]);

  useEffect(() => {
    const loadVoices = () => window.speechSynthesis.getVoices(); loadVoices();
    if (typeof window.speechSynthesis !== 'undefined' && window.speechSynthesis.onvoiceschanged !== undefined) window.speechSynthesis.onvoiceschanged = loadVoices;
  }, []);

 

  // --- 互動功能方法 ---

  const handlePronounceRef = useRef();
  const handlePronounce = (item, isContentReading = false, customText = null, e = null, onEndCallback = null) => {
    if (e) {
      e.stopPropagation();
      spawnParticles(e, ['✨', '🎵', '⭐', '🎈']);
    }
    const isEnglishSubject = currentSubject === 'english';
    let defaultText = '';
    if (item) { defaultText = item.pronounceText || (isEnglishSubject ? item.word : (language === 'en' ? item.translation.split('/')[0].trim() : item.word)); }
    const textToSpeak = customText ? customText : defaultText;
    const targetId = item?.word || 'reading';
    
    if ('speechSynthesis' in window) {
      window.speechSynthesis.resume(); window.speechSynthesis.cancel(); 
      const forceEnglish = isEnglishSubject || (language === 'en' && !isContentReading);
      const utterance = getVoiceUtterance(textToSpeak, isContentReading ? speechSpeed : 1.0, forceEnglish, language);
      if (!utterance) { if(onEndCallback) onEndCallback(); return; }
      utterance.onstart = () => setActiveWord(targetId);
      utterance.onend = () => { setActiveWord(null); if(onEndCallback) onEndCallback(); };
      utterance.onerror = () => { setActiveWord(null); if(onEndCallback) onEndCallback(); };
      setTimeout(() => window.speechSynthesis.speak(utterance), 50);
    } else { showToast('此瀏覽器不支援語音功能。'); if(onEndCallback) onEndCallback(); }
  };
  handlePronounceRef.current = handlePronounce;
  const stableOnPronounce = useCallback((...args) => handlePronounceRef.current(...args), []);



  const startPractice = (startIdx, endIdx) => {
    if (!('speechSynthesis' in window)) {
      showToast('此瀏覽器不支援語音功能。');
      return;
    }
    window.speechSynthesis.resume(); window.speechSynthesis.cancel(); window.speechSynthesis.speak(new SpeechSynthesisUtterance(''));
    let rangeVocab = selectedCardIndices.length > 0 ? [...selectedCardIndices].sort((a, b) => a - b).map(idx => currentVocabulary[idx]) : currentVocabulary.slice(startIdx - 1, endIdx);
    let finalWords = [...rangeVocab];
    if (practiceOrder === 'random') finalWords.sort(() => 0.5 - Math.random());
    setPracticeMode({ isActive: true, isDictation: practiceType === 'dictation', revealedWords: [], originalWords: rangeVocab, words: finalWords, currentIndex: 0, countdown: practiceWaitTime, currentRound: 1, totalRounds: practiceSessionRounds });
    setIsPracticeModalOpen(false);
  };

  const stopPractice = useCallback(() => {
    setPracticeMode(prev => ({...prev, isActive: false}));
    if (practiceTimerRef.current) clearInterval(practiceTimerRef.current);
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    setActiveWord(null);
  }, []);

  useEffect(() => {
    let isSubscribed = true;
    if (!practiceMode.isActive) return;
    if (practiceMode.currentIndex >= practiceMode.words.length) {
       if (practiceMode.currentRound < practiceMode.totalRounds) {
           let nextWords = [...practiceMode.originalWords];
           if (practiceOrder === 'random') nextWords.sort(() => 0.5 - Math.random());
           setPracticeMode(prev => ({ ...prev, words: nextWords, currentIndex: 0, currentRound: prev.currentRound + 1, countdown: practiceWaitTime, revealedWords: [] }));
       } else { setPracticeMode(prev => ({...prev, isActive: false})); }
       return;
    }

    const currentWord = practiceMode.words[practiceMode.currentIndex];
    setTimeout(() => {
        const el = document.getElementById(`word-card-${currentWord.word}`);
        if (el) { const y = el.getBoundingClientRect().top + window.scrollY - (window.innerHeight / 2) + (el.offsetHeight / 2); window.scrollTo({ top: y, behavior: 'smooth' }); }
    }, 300);

    let timeLeft = practiceWaitTime;
    setPracticeMode(prev => ({...prev, countdown: timeLeft}));
    if (practiceTimerRef.current) clearInterval(practiceTimerRef.current);

    if (practiceMode.isDictation) {
        let playCount = 0;
        const playAudioSequence = () => {
            if (!isSubscribed) return;
            playCount++;
            handlePronounce(currentWord, false, null, null, () => {
                if (!isSubscribed) return;
                if (playCount < practiceRepeatTimes) { setTimeout(playAudioSequence, 1000); } else { startDictationCountdown(); }
            });
        };
        const startDictationCountdown = () => {
            practiceTimerRef.current = setInterval(() => {
                timeLeft -= 1; if (!isSubscribed) return;
                setPracticeMode(p => ({...p, countdown: timeLeft}));
                if (timeLeft <= 0) {
                    clearInterval(practiceTimerRef.current);
                    setPracticeMode(p => ({ ...p, revealedWords: [...p.revealedWords, currentWord.word] }));
                    setTimeout(() => { if (isSubscribed) setPracticeMode(p => ({...p, currentIndex: p.currentIndex + 1, countdown: practiceWaitTime})); }, 3000);
                }
            }, 1000);
        };
        playAudioSequence();
    } else {
        practiceTimerRef.current = setInterval(() => {
          timeLeft -= 1; if (!isSubscribed) return;
          setPracticeMode(prev => ({...prev, countdown: timeLeft}));
          if (timeLeft <= 0) {
            clearInterval(practiceTimerRef.current);
            let playCount = 0;
            const playNext = () => {
                if (!isSubscribed) return;
                playCount++;
                handlePronounce(currentWord, false, null, null, () => {
                    if (!isSubscribed) return;
                    if (playCount < practiceRepeatTimes) { setTimeout(playNext, 1000); } else { setTimeout(() => { if (isSubscribed) setPracticeMode(p => ({...p, currentIndex: p.currentIndex + 1, countdown: practiceWaitTime})); }, 1500); }
                });
            };
            playNext(); 
          }
        }, 1000);
    }
    return () => { isSubscribed = false; clearInterval(practiceTimerRef.current); };
  }, [practiceMode.isActive, practiceMode.currentIndex, practiceMode.words, practiceMode.currentRound, practiceMode.totalRounds, practiceOrder, practiceRepeatTimes, practiceWaitTime, practiceMode.isDictation]);

  const stopChapterReading = useCallback(() => {
    isReadingRef.current = false; setIsPaused(false); setIsChapterReadingActive(false); setActiveWordIndex(null); setHomophoneTooltip(null); 
    if ('speechSynthesis' in window) { window.speechSynthesis.resume(); window.speechSynthesis.cancel(); }
    setCurrentReadIndex(-1); currentReadIndexRef.current = -1; currentChapterRepeatCountRef.current = 0; setCurrentReadingRound(1);
  }, []);

  useEffect(() => { stopChapterReading(); setReadingChapter(null); }, [currentChapter, stopChapterReading]);

  const playChunk = (index) => {
    if (!isReadingRef.current || !('speechSynthesis' in window)) {
      setCurrentReadIndex(-1); currentReadIndexRef.current = -1; isReadingRef.current = false; setIsPaused(false); setIsChapterReadingActive(false); setActiveWordIndex(null); return;
    }
    if (index >= readSentencesRef.current.length) {
      currentChapterRepeatCountRef.current += 1;
      if (currentChapterRepeatCountRef.current < chapterRepeatTimesRef.current) {
        setCurrentReadIndex(-1); setCurrentReadingRound(currentChapterRepeatCountRef.current + 1); setTimeout(() => { if (isReadingRef.current) playChunk(0); }, 1000); return;
      } else {
        setCurrentReadIndex(-1); currentReadIndexRef.current = -1; isReadingRef.current = false; setIsPaused(false); setIsChapterReadingActive(false); setActiveWordIndex(null); currentChapterRepeatCountRef.current = 0; setCurrentReadingRound(1); return;
      }
    }
    setCurrentReadIndex(index); currentReadIndexRef.current = index; setActiveWordIndex(null);
    const chunk = readSentencesRef.current[index];
    const utterance = getVoiceUtterance(chunk, speedRef.current, currentSubject === 'english', language);
    if (!utterance) { if (isReadingRef.current) playChunk(index + 1); return; }
    utterance.onend = () => { if (isReadingRef.current) playChunk(index + 1); };
    utterance.onerror = (e) => { if (e.error !== 'interrupted' && e.error !== 'canceled' && isReadingRef.current) playChunk(index + 1); };
    window.speechSynthesis.speak(utterance);
  };

  const readSingleSentence = (index, text, e) => {
    if (e) { e.stopPropagation(); spawnParticles(e, ['💬', '🗣️', '✨', '🎵']); }
    if (!('speechSynthesis' in window)) { showToast('此瀏覽器不支援語音功能。'); return; }
    isReadingRef.current = false; setIsPaused(false); window.speechSynthesis.cancel(); 
    setCurrentReadIndex(index); currentReadIndexRef.current = index; setActiveWordIndex(null);
    const utterance = getVoiceUtterance(text, speedRef.current, currentSubject === 'english', language);
    if (!utterance) return;
    utterance.onend = () => { if (currentReadIndexRef.current === index && !isReadingRef.current) { setCurrentReadIndex(-1); currentReadIndexRef.current = -1; } };
    utterance.onerror = (e) => { if (e.error !== 'interrupted' && e.error !== 'canceled' && currentReadIndexRef.current === index && !isReadingRef.current) { setCurrentReadIndex(-1); currentReadIndexRef.current = -1; } };
    window.speechSynthesis.speak(utterance);
  };

  const readSingleWord = (idx, wIdx, word, e) => {
    if (e) {
      e.stopPropagation(); spawnParticles(e, ['💬', '🗣️', '✨', '🎵']);
      const rect = e.currentTarget.getBoundingClientRect();
      const charsWithHomophones = Array.from(word).map(c => ({ char: c, homophones: HOMOPHONE_DB[c] || [] })).filter(item => item.homophones.length > 0);
      if (charsWithHomophones.length > 0) setHomophoneTooltip({ wordId: `s${idx}-w${wIdx}`, x: rect.left + rect.width / 2, y: rect.top, data: charsWithHomophones }); else setHomophoneTooltip(null);
    }
    if (!('speechSynthesis' in window)) { showToast('此瀏覽器不支援語音功能。'); return; }
    isReadingRef.current = false; setIsPaused(false); window.speechSynthesis.cancel();
    setCurrentReadIndex(idx); currentReadIndexRef.current = idx; const wordId = `s${idx}-w${wIdx}`; setActiveWordIndex(wordId);
    const utterance = getVoiceUtterance(word, speedRef.current, currentSubject === 'english', language);
    if (!utterance) { setActiveWordIndex(prev => prev === wordId ? null : prev); return; }
    utterance.onend = () => { setActiveWordIndex(prev => prev === wordId ? null : prev); if (currentReadIndexRef.current === idx && !isReadingRef.current) { setCurrentReadIndex(-1); currentReadIndexRef.current = -1; } };
    utterance.onerror = () => { setActiveWordIndex(prev => prev === wordId ? null : prev); if (currentReadIndexRef.current === idx && !isReadingRef.current) { setCurrentReadIndex(-1); currentReadIndexRef.current = -1; } };
    window.speechSynthesis.speak(utterance);
  };

  const handleSpeedChange = useCallback((e) => {
    const newSpeed = parseFloat(e.target.value); 
    setSpeechSpeed(newSpeed); 
    speedRef.current = newSpeed; 
    window.__speechSpeed = newSpeed;
    if (isReadingRef.current && currentReadIndexRef.current !== -1) {
      const currentIndex = currentReadIndexRef.current;
      isReadingRef.current = false; 
      if ('speechSynthesis' in window) { window.speechSynthesis.resume(); window.speechSynthesis.cancel(); }
      setIsPaused(false); 
      setTimeout(() => { isReadingRef.current = true; playChunk(currentIndex); }, 50);
    }
  }, []);

  const handlePauseToggle = useCallback(() => {
    if (!('speechSynthesis' in window)) return;
    if (isPaused || window.speechSynthesis.paused) { window.speechSynthesis.resume(); setIsPaused(false); } else { window.speechSynthesis.pause(); setIsPaused(true); }
  }, [isPaused]);

  const handleReadChapter = () => {
    const chapter = availableChapters.find(ch => ch.id === currentChapter);
    if (!chapter || !chapter.content) {
      showToast('此章節暫未提供課文內容。');
      return;
    }
    if (!('speechSynthesis' in window)) {
      showToast('此瀏覽器不支援語音功能。');
      return;
    }
    setReadingChapter(chapter);
    const chunks = chapter.content.match(/[^，。！？；、：\n.!?]+[，。！？；、：\n.!?]?/g) || [chapter.content];
    setReadSentences(chunks); readSentencesRef.current = chunks;
    setCurrentReadIndex(-1); currentReadIndexRef.current = -1; currentChapterRepeatCountRef.current = 0; setCurrentReadingRound(1); setIsPaused(false); setIsChapterReadingActive(true);
    window.speechSynthesis.resume(); window.speechSynthesis.cancel();
    setTimeout(() => { isReadingRef.current = true; playChunk(0); }, 50);
  };

  // ==========================================
  // --- UI 渲染區塊 ---
  // ==========================================

  return (
    <div className="min-h-screen bg-slate-50 p-4 md:p-8 font-sans pb-24 relative overflow-hidden">
      <style>{`@keyframes float-particle { 0% { transform: translate(-50%, -50%) scale(0.5) rotate(0deg); opacity: 1; } 100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.5) rotate(var(--rot)); opacity: 0; } } .animate-float-particle { animation: float-particle 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; } .hide-scrollbar::-webkit-scrollbar { display: none; } .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }`}</style>
      
      {/* 粒子特效與背景 */}
      {particles.map(p => (<div key={p.id} className="fixed pointer-events-none z-[100] animate-float-particle text-2xl md:text-3xl drop-shadow-sm" style={{ left: p.x, top: p.y, '--tx': `${p.tx}px`,'--ty':`${p.ty}px`, '--rot': `${p.rot}deg` }}>{p.symbol}</div>))}
      <div className="fixed inset-0 pointer-events-none">
        <div className="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] rounded-full bg-purple-400/20 blur-[100px]"></div>
        <div className="absolute bottom-[-10%] left-[20%] w-[600px] h-[600px] rounded-full bg-pink-400/20 blur-[120px]"></div>
      </div>

      {/* 訊息提示 (Toast) */}
      {toastMsg && (
        <div className="fixed top-24 left-1/2 transform -translate-x-1/2 z-[100] bg-indigo-600 text-white px-6 py-3 rounded-full shadow-2xl flex items-center gap-2 font-bold animate-in fade-in slide-in-from-top-10">
          <CheckCircle size={20} />{toastMsg}
        </div>
      )}

      {/* 頂部導航列 */}
      <nav className="fixed top-0 left-0 right-0 z-[60] bg-white/90 backdrop-blur-xl border-b border-slate-200/60 shadow-md px-2 sm:px-4 py-2 sm:py-3 flex flex-row items-center justify-start md:justify-between gap-2 sm:gap-4 transition-all overflow-x-auto hide-scrollbar flex-nowrap whitespace-nowrap">
        <div className="flex shrink-0 items-center gap-1.5 sm:gap-2 flex-nowrap w-2 sm:w-8"></div>
        
        {/* 核心設定控制區 */}
        <div className="flex shrink-0 items-center justify-center gap-1.5 sm:gap-3 flex-nowrap">
          {/* Profile 切換 */}
          <div className="inline-flex bg-slate-100/80 rounded-full p-1 shadow-inner border border-slate-200/60">
            {PROFILES.map(p => (
              <button key={p.id} onClick={() => handleProfileChange(p.id)} className={`flex items-center gap-1 px-2.5 py-1 sm:px-4 sm:py-1.5 rounded-full text-[10px] sm:text-sm font-semibold transition-all ${currentProfile === p.id ? 'bg-pink-50 text-pink-600 shadow-md' : 'text-slate-500 hover:bg-slate-200'}`}>
                <User size={12} className={`sm:w-3.5 sm:h-3.5 ${currentProfile === p.id ? 'text-pink-600' : 'text-pink-400'}`} /> 
                <span className="hidden sm:inline">{p.name}</span><span className="sm:hidden">{p.name.charAt(0)}</span>
              </button>

          </div>
          
          {/* 科目切換 */}
          <div className="inline-flex bg-slate-100/80 rounded-full p-1 shadow-inner border border-slate-200/60">

                <Languages size={12} className={`sm:w-3.5 sm:h-3.5 ${currentSubject === s.id ? 'text-white' : 'text-teal-500'}`} />

              <button key={l.id} onClick={() => setLanguage(l.id)} className={`px-2.5 py-1 sm:px-4 sm:py-1.5 rounded-full text-[10px] sm:text-sm font-semibold transition-all ${language===l.id?'bg-indigo-500 text-white shadow-md':'text-slate-500 hover:bg-slate-200'}`}>
                <span className="hidden sm:inline">{l.label}</span><span className="sm:hidden">{l.short}</span>
              </button>
            ))}
          </div>
        </div>
        
        {/* 右側更新日誌按鈕 */}
        <div className="flex shrink-0 flex-nowrap">
          <button onClick={() => setIsChangelogOpen(true)} className="flex items-center gap-1 text-[10px] sm:text-xs font-mono text-slate-500 bg-slate-100 hover:bg-white px-2.5 py-1.5 sm:px-4 sm:py-2 rounded-full border border-slate-200 shadow-sm transition-all hover:scale-105 hover:text-indigo-600 hover:border-indigo-300">
            <History size={12} /> <span className="hidden sm:inline">{APP_VERSION}</span>
          </button>
        </div>
      </nav>

      {/* 頁面主要內容 */}
      <div className="max-w-6xl mx-auto relative z-10 px-4 md:px-8 pt-20 sm:pt-24 lg:pt-28">
        
        {/* 標題區 */}
        <header className="mb-10 flex flex-row flex-wrap items-center justify-start gap-3 sm:gap-4 text-left">
          <h1 className="text-3xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-pink-500 shrink-0">{t.title}</h1>
          <p className="text-slate-600 text-xs md:text-sm bg-white/50 backdrop-blur-sm px-4 py-1.5 rounded-full inline-block border border-white/40 shadow-sm m-0">{t.subtitle}</p>
        </header>

        {/* 主要功能按鈕列 */}
        <div className="flex flex-wrap justify-center items-center gap-4 mb-8">
          <button onClick={handleReadChapter} className="flex items-center justify-center gap-2 bg-blue-500 hover:bg-blue-600 text-white px-6 py-4 rounded-full shadow-lg hover:scale-105 transition-all text-base md:text-lg font-bold">
            <Volume2 size={24} /> {t.readChapter}
          </button>
          <button onClick={() => setIsPracticeModalOpen(true)} disabled={currentVocabulary.length === 0 || practiceMode.isActive} className={`flex items-center justify-center gap-2 px-6 py-4 rounded-full shadow-lg transition-all text-base md:text-lg font-bold ${currentVocabulary.length === 0 || practiceMode.isActive ? 'bg-slate-300 text-slate-500 cursor-not-allowed' : 'bg-amber-500 text-white hover:bg-amber-600 hover:scale-105'}`}>
            <Timer size={24} /> {t.practiceMode}
          </button>
          <button onClick={() => setIsChapterPracticeOpen(true)} disabled={!PRACTICE_DB[currentChapter]} className={`flex items-center justify-center gap-2 px-6 py-4 rounded-full shadow-lg transition-all text-base md:text-lg font-bold ${!PRACTICE_DB[currentChapter] ? 'bg-slate-300 text-slate-500 cursor-not-allowed' : 'bg-teal-500 text-white hover:bg-teal-600 hover:scale-105'}`}>
            <PenTool size={24} /> {t.chapterPractice || '章節練習'}
          </button>
          <div className="flex items-center gap-3 bg-white px-5 py-3 rounded-full shadow-lg border-2 border-indigo-50/50 flex-grow sm:flex-grow-0 md:ml-2">
            <Volume2 size={20} className="text-indigo-400" />
            <span className="text-sm md:text-base font-bold text-slate-600 whitespace-nowrap">{t.speedLabel}</span>
            <input type="range" min="0.2" max="1.5" step="0.1" value={speechSpeed} onChange={handleSpeedChange} className="w-24 md:w-32 accent-indigo-500 cursor-pointer" />
            <span className="text-sm md:text-base font-mono text-indigo-600 font-bold w-10 text-right">{speechSpeed.toFixed(1)}x</span>
          </div>
        </div>

        {/* 課文朗讀視窗 */}
        {readingChapter && (
          <div className="bg-white p-6 md:p-8 rounded-3xl shadow-xl border-4 border-amber-100 mb-12 max-w-5xl mx-auto animate-in fade-in slide-in-from-bottom-4 relative">
             <div className="absolute -top-8 -left-4 text-6xl drop-shadow-lg animate-bounce" style={{animationDuration: '3s'}}>🐦</div>
             <div className="absolute -bottom-6 -right-2 text-6xl drop-shadow-lg">🌿</div>
             <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6 border-b border-amber-100 pb-4 relative z-10">
               <h3 className="text-2xl md:text-3xl font-extrabold text-amber-800 flex items-center gap-3">
                 <div className="bg-amber-100 p-2 rounded-2xl shadow-sm"><BookOpen className="text-amber-600" size={28} /></div>
                 {readingChapter.title}
               </h3>
               
               {/* 課文控制列 */}
               <div className="flex flex-wrap items-center gap-3 w-full md:w-auto">
                 <div className="flex items-center gap-1 bg-amber-50 p-1 rounded-full border border-amber-200/60 shadow-inner">
                   <button onClick={() => setReadingMode('word')} className={`px-4 py-1.5 rounded-full text-xs md:text-sm font-bold transition-all ${readingMode === 'word' ? 'bg-white shadow text-amber-600' : 'text-amber-700/60 hover:text-amber-700'}`}>{t.wordMode}</button>
                   <button onClick={() => setReadingMode('sentence')} className={`px-4 py-1.5 rounded-full text-xs md:text-sm font-bold transition-all ${readingMode === 'sentence' ? 'bg-white shadow text-amber-600' : 'text-amber-700/60 hover:text-amber-700'}`}>{t.sentenceMode}</button>
                 </div>
                 <div className="flex items-center gap-2 bg-amber-50 px-4 py-2 rounded-full border border-amber-200/60 shadow-inner flex-grow md:flex-grow-0">
                   <span className="text-sm font-bold text-amber-700/70">{t.repeatLabel.replace('：', '')}</span>
                   <div className="flex items-center gap-1.5 ml-1">
                     <button onClick={() => { setChapterRepeatTimes(p => { const v = Math.max(1, p - 1); chapterRepeatTimesRef.current = v; return v; }); }} className="w-6 h-6 flex items-center justify-center rounded-full bg-amber-200 text-amber-700 hover:bg-amber-300 transition-colors shadow-sm"><Minus size={14} /></button>
                     <span className="text-sm font-black text-amber-700 w-6 text-center">{chapterRepeatTimes}</span>
                     <button onClick={() => { setChapterRepeatTimes(p => { const v = Math.min(100, p + 1); chapterRepeatTimesRef.current = v; return v; }); }} className="w-6 h-6 flex items-center justify-center rounded-full bg-amber-200 text-amber-700 hover:bg-amber-300 transition-colors shadow-sm"><Plus size={14} /></button>
                   </div>
                 </div>
                 <div className="flex gap-2">
                   <button onClick={handleReadChapter} className="p-3 bg-amber-100 text-amber-600 rounded-full hover:bg-amber-200 transition-colors shadow-sm"><Volume2 size={20} /></button>
                   <button onClick={handlePauseToggle} disabled={currentReadIndex === -1 && !isPaused} className={`p-3 rounded-full transition-colors shadow-sm ${currentReadIndex === -1 && !isPaused ? 'bg-slate-100 text-slate-300' : 'bg-orange-100 text-orange-600 hover:bg-orange-200'}`}>{isPaused ? <Play size={20} className="fill-current ml-0.5" /> : <Pause size={20} className="fill-current" />}</button>
                   <button onClick={stopChapterReading} className="p-3 bg-rose-100 text-rose-600 rounded-full hover:bg-rose-200 transition-colors shadow-sm"><Square size={20} className="fill-current" /></button>
                   <button onClick={() => { stopChapterReading(); setReadingChapter(null); }} className="p-3 bg-slate-100 text-slate-400 hover:text-slate-600 hover:bg-slate-200 rounded-full transition-colors shadow-sm"><X size={20} /></button>
                 </div>
               </div>
             </div>
             
             {/* 課文閱讀內容 */}
             <div className="bg-[#fdfaf3] p-6 md:p-12 rounded-2xl border-2 border-amber-50 shadow-inner max-h-[65vh] overflow-y-auto relative overflow-hidden">
               {readingChapter.bgImage && (<div className="absolute inset-0 z-0 opacity-25 pointer-events-none mix-blend-multiply" style={{ backgroundImage: `url('${readingChapter.bgImage}')`, backgroundSize: 'cover', backgroundPosition: 'center', backgroundRepeat: 'no-repeat' }} />)}
               <div className="absolute top-8 left-6 text-4xl opacity-30 select-none pointer-events-none -rotate-12 z-0">🍃</div>
               <div className="absolute bottom-10 right-10 text-5xl opacity-30 select-none pointer-events-none rotate-12 z-0">🌸</div>
               <div className="absolute top-1/3 right-6 text-3xl opacity-30 select-none pointer-events-none animate-pulse z-0">🦋</div>
               <div className="absolute bottom-1/4 left-4 text-3xl opacity-30 select-none pointer-events-none scale-x-[-1] z-0">🐛</div>
               
               <p className="text-4xl md:text-5xl lg:text-6xl font-serif leading-[1.8] md:leading-[1.8] tracking-wide indent-[2em] text-justify relative z-10 text-slate-700">
                 {readSentences.length > 0 ? (
                   readSentences.map((sentence, idx) => {
                     const isCurrentSentence = currentReadIndex === idx;
                     const isPastSentence = currentReadIndex > idx && currentReadIndex !== -1 && isReadingRef.current;
                     const sentenceColorClass = isCurrentSentence 
                        ? (isPaused ? 'text-orange-600 bg-orange-100/70 font-bold shadow-sm' : 'text-amber-700 bg-amber-200/60 font-bold shadow-sm') 
                        : isPastSentence ? 'text-slate-400' : 'text-slate-700';
                     
                     if (readingMode === 'sentence') {
                       return (
                         <span key={idx} ref={isCurrentSentence ? activeSentenceRef : null} onClick={(e) => readSingleSentence(idx, sentence, e)} className={`cursor-pointer hover:bg-amber-100/50 active:bg-amber-200 transition-colors duration-200 rounded-xl px-1 ${sentenceColorClass}`}>

                     } else {
                       const words = segmentChineseText(sentence);
                       return (

                           {words.map((word, wIdx) => {

                                              {practiceInputs[`sm-${sIdx}`] === sec.sentenceMaking.ans ? <><CheckCircle size={18} /> 答對了！非常棒！</> : <><AlertCircle size={18} /> 不對喔，請再試一次！</>}
                                            </div>
                                          )}
                                        </div>
                                      ) : (
                                        <textarea className="w-full bg-slate-50 border border-slate-200 rounded-lg p-3 outline-none focus:border-indigo-400 transition-colors" rows="2" placeholder="請輸入你的造句..." value={practiceInputs[`sm-${sIdx}`] || ''} onChange={(e) => setPracticeInputs(p => ({...p, [`sm-${sIdx}`]: e.target.value}))} disabled={isSmRevealed} />
                                      )}
                                      {isSmRevealed && !sec.sentenceMaking.options && (
                                        <div className="mt-3 p-3 bg-emerald-50 text-emerald-700 rounded-lg text-sm font-medium border border-emerald-100 animate-in fade-in flex items-center justify-between gap-3">
                                          <span>💡 建議答案：{sec.sentenceMaking.ans}</span>
                                          <button onClick={(e) => { e.stopPropagation(); handlePronounce({ word: 'ans' }, true, sec.sentenceMaking.ans, e); }} className="p-1.5 sm:p-2 text-emerald-500 hover:text-emerald-700 bg-emerald-100 hover:bg-emerald-200 rounded-full transition-colors flex-shrink-0" title="朗讀建議答案">
                                            <Volume2 size={16} />
                                          </button>
                                        </div>
                                      )}
                                    </div>
                                  );
                                })()}
                             </div>
                           );
                         })()}
                       </div>
                     ))}
                   </div>
                 )}
               </div>

               {/* 練習控制按鈕 */}
               <div className="flex flex-col sm:flex-row gap-3 mt-6 pt-6 border-t border-slate-100 flex-shrink-0">
                  <button onClick={() => setShowPracticeAnswers(!showPracticeAnswers)} className={`flex-1 py-3 rounded-xl font-bold text-base transition-all shadow-sm flex items-center justify-center gap-2 ${showPracticeAnswers ? 'bg-indigo-100 text-indigo-700 hover:bg-indigo-200' : 'bg-indigo-500 text-white hover:bg-indigo-600 hover:scale-[1.02]'}`}>
                    {showPracticeAnswers ? (t.hideSuggestedAnswers || '隱藏建議答案') : (t.showSuggestedAnswers || '顯示建議答案')}
                  </button>
                  <button onClick={() => { setPracticeInputs({}); setShowPracticeAnswers(false); setIndividualReveals({}); }} className="flex-1 py-3 rounded-xl font-bold text-base transition-all shadow-sm flex items-center justify-center gap-2 bg-slate-100 text-slate-600 hover:bg-slate-200">
                    {t.clearAnswers || '清除作答'}
                  </button>
               </div>
             </div>
          </div>
        );
      })()}

      {/* 單字抽查設定 Modal */}
      {isPracticeModalOpen && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-sm animate-in fade-in" onClick={() => setIsPracticeModalOpen(false)}>
           <div className="bg-white rounded-[2rem] p-6 md:p-8 w-full max-w-2xl shadow-2xl relative animate-in zoom-in-95" onClick={e=>e.stopPropagation()}>
             <button onClick={() => setIsPracticeModalOpen(false)} className="absolute top-4 right-4 md:top-6 md:right-6 p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-full"><X size={24} /></button>
             <h2 className="text-xl sm:text-2xl font-bold text-slate-800 mb-5 flex items-center gap-2"><Timer className="text-amber-500" size={26} /> {t.practiceSetup}</h2>
             
             <div className="mb-6">
                 <label className="block text-sm sm:text-base font-bold text-slate-500 mb-2 pl-1">{t.practiceTypeLabel}</label>
                 <div className="flex bg-slate-100 p-1.5 rounded-xl">
                   <button onClick={() => setPracticeType('standard')} className={`flex-1 py-2 sm:py-2.5 text-base sm:text-lg font-bold rounded-lg transition-all ${practiceType === 'standard' ? 'bg-white shadow-md text-amber-600' : 'text-slate-500 hover:text-slate-700'}`}>{t.practiceModeStandard}</button>
                   <button onClick={() => setPracticeType('dictation')} className={`flex-1 py-2 sm:py-2.5 text-base sm:text-lg font-bold rounded-lg transition-all ${practiceType === 'dictation' ? 'bg-white shadow-md text-amber-600' : 'text-slate-500 hover:text-slate-700'}`}>{t.practiceModeDictation}</button>
                 </div>
             </div>
             
             {selectedCardIndices.length > 0 ? (
               <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6 bg-emerald-50 p-4 rounded-2xl border border-emerald-200 shadow-inner">
                 <span className="text-emerald-700 font-bold text-sm sm:text-base whitespace-nowrap flex items-center gap-2"><CheckCircle size={20} className="text-emerald-500" /> {t.selectedCardsLabel ? t.selectedCardsLabel.replace('{count}', selectedCardIndices.length) : `已選取 ${selectedCardIndices.length} 個單字`}</span>
                 <button onClick={() => setSelectedCardIndices([])} className="text-sm font-bold text-emerald-600 bg-white px-3 py-1.5 rounded-lg shadow-sm border border-emerald-100 hover:bg-emerald-100 hover:text-emerald-800 transition-colors">{t.clearSelection || '清除選取'}</button>
               </div>
             ) : (
               <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6 bg-slate-50 p-4 rounded-2xl border border-slate-100">
                 <span className="text-slate-600 font-medium text-sm sm:text-base whitespace-nowrap">{t.practiceRange}</span>
                 <div className="flex items-center gap-2 sm:gap-3">
                   <span className="text-xs sm:text-sm font-bold text-slate-500">{t.from}</span>
                   <div className="relative">
                     <select value={practiceRangeStart} onChange={e => { const val = Number(e.target.value); setPracticeRangeStart(val); if (val > practiceRangeEnd) setPracticeRangeEnd(val); }} className="w-16 sm:w-20 p-2 pl-3 pr-6 rounded-xl border-2 border-slate-200 bg-white text-slate-700 font-bold text-base sm:text-lg focus:border-amber-400 outline-none appearance-none cursor-pointer">{currentVocabulary.map((_, i) => (<option key={i} value={i + 1}>{i + 1}</option>))}</select>
                     <ChevronDown size={16} className="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none" />
                   </div>
                   <span className="text-slate-300 font-bold mx-1">-</span>
                   <span className="text-xs sm:text-sm font-bold text-slate-500">{t.to}</span>
                   <div className="relative">
                     <select value={practiceRangeEnd} onChange={e => setPracticeRangeEnd(Number(e.target.value))} className="w-16 sm:w-20 p-2 pl-3 pr-6 rounded-xl border-2 border-slate-200 bg-white text-slate-700 font-bold text-base sm:text-lg focus:border-amber-400 outline-none appearance-none cursor-pointer">{currentVocabulary.map((_, i) => (<option key={i} value={i + 1} disabled={i + 1 < practiceRangeStart}>{i + 1}</option>))}</select>
                     <ChevronDown size={16} className="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none" />
                   </div>
                 </div>
               </div>
             )}
             
             <div className="mb-6">
                 <label className="block text-sm sm:text-base font-bold text-slate-500 mb-2 pl-1">{t.orderLabel}</label>
                 <div className="flex bg-slate-100 p-1.5 rounded-xl">
                   <button onClick={() => setPracticeOrder('random')} className={`flex-1 py-2 sm:py-2.5 text-base sm:text-lg font-bold rounded-lg transition-all ${practiceOrder === 'random' ? 'bg-white shadow-md text-amber-600' : 'text-slate-500 hover:text-slate-700'}`}>{t.orderRandom}</button>
                   <button onClick={() => setPracticeOrder('sequence')} className={`flex-1 py-2 sm:py-2.5 text-base sm:text-lg font-bold rounded-lg transition-all ${practiceOrder === 'sequence' ? 'bg-white shadow-md text-amber-600' : 'text-slate-500 hover:text-slate-700'}`}>{t.orderSequence}</button>
                 </div>
             </div>
             
             <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 sm:gap-6 mb-8">
               <div>
                 <div className="flex justify-between items-center mb-2 pl-1 pr-1"><label className="text-xs sm:text-sm font-bold text-slate-500">{t.waitTimeLabel}</label><span className="text-sm sm:text-base font-black text-amber-500">{practiceWaitTime}s</span></div>
                 <div className="flex items-center gap-2 mt-1"><button onClick={() => setPracticeWaitTime(p => Math.max(1, p - 1))} className="w-8 h-8 sm:w-10 sm:h-10 flex-shrink-0 flex items-center justify-center rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200 transition-colors shadow-sm"><Minus size={16} /></button><input type="range" min="1" max="45" step="1" value={practiceWaitTime} onChange={e => setPracticeWaitTime(Number(e.target.value))} className="w-full h-2 accent-amber-500 cursor-pointer" /><button onClick={() => setPracticeWaitTime(p => Math.min(45, p + 1))} className="w-8 h-8 sm:w-10 sm:h-10 flex-shrink-0 flex items-center justify-center rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200 transition-colors shadow-sm"><Plus size={16} /></button></div>
               </div>
               <div>
                 <div className="flex justify-between items-center mb-2 pl-1 pr-1"><label className="text-xs sm:text-sm font-bold text-slate-500">{t.repeatLabel}</label><span className="text-sm sm:text-base font-black text-amber-500">{practiceRepeatTimes} {t.timesUnit}</span></div>
                 <div className="flex items-center gap-2 mt-1"><button onClick={() => setPracticeRepeatTimes(p => Math.max(1, p - 1))} className="w-8 h-8 sm:w-10 sm:h-10 flex-shrink-0 flex items-center justify-center rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200 transition-colors shadow-sm"><Minus size={16} /></button><input type="range" min="1" max="5" step="1" value={practiceRepeatTimes} onChange={e => setPracticeRepeatTimes(Number(e.target.value))} className="w-full h-2 accent-amber-500 cursor-pointer" /><button onClick={() => setPracticeRepeatTimes(p => Math.min(5, p + 1))} className="w-8 h-8 sm:w-10 sm:h-10 flex-shrink-0 flex items-center justify-center rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200 transition-colors shadow-sm"><Plus size={16} /></button></div>
               </div>
               <div>
                 <div className="flex justify-between items-center mb-2 pl-1 pr-1"><label className="text-xs sm:text-sm font-bold text-slate-500">{t.roundsLabel}</label><span className="text-sm sm:text-base font-black text-amber-500">{practiceSessionRounds} {t.roundsUnit}</span></div>
                 <div className="flex items-center gap-2 mt-1"><button onClick={() => setPracticeSessionRounds(p => Math.max(1, p - 1))} className="w-8 h-8 sm:w-10 sm:h-10 flex-shrink-0 flex items-center justify-center rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200 transition-colors shadow-sm"><Minus size={16} /></button><input type="range" min="1" max="10" step="1" value={practiceSessionRounds} onChange={e => setPracticeSessionRounds(Number(e.target.value))} className="w-full h-2 accent-amber-500 cursor-pointer" /><button onClick={() => setPracticeSessionRounds(p => Math.min(10, p + 1))} className="w-8 h-8 sm:w-10 sm:h-10 flex-shrink-0 flex items-center justify-center rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200 transition-colors shadow-sm"><Plus size={16} /></button></div>
               </div>
             </div>
             
             <button onClick={() => startPractice(practiceRangeStart, practiceRangeEnd)} className="w-full py-4 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-bold text-lg sm:text-xl shadow-md transition-all hover:scale-[1.02] flex justify-center items-center gap-2">
               <Play size={24} className="fill-current" /> {t.startPractice}
             </button>
           </div>
        </div>
      )}

      {/* 抽查模式浮動控制列 */}
      {practiceMode.isActive && (
        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900/90 backdrop-blur-md text-white px-6 py-3 rounded-full shadow-2xl flex items-center gap-5 animate-in slide-in-from-bottom-10 border border-slate-700/50">
           <span className="flex items-center gap-2 font-bold text-sm sm:text-base"><Timer size={20} className="text-amber-400 animate-pulse" /> {t.practiceMode} {practiceMode.totalRounds > 1 ? `(${practiceMode.currentRound}/${practiceMode.totalRounds})` : ''} : {practiceMode.currentIndex + 1} / {practiceMode.words.length}</span>
           <div className="w-px h-6 bg-slate-600"></div>
           <button onClick={stopPractice} className="text-rose-400 hover:text-rose-300 flex items-center gap-1.5 text-sm sm:text-base font-bold transition-colors"><StopCircle size={18} /> {t.stopPractice}</button>
        </div>
      )}

      {/* 課文朗讀模式浮動控制列 */}
      {isChapterReadingActive && (
        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900/90 backdrop-blur-md text-white px-6 py-3 rounded-full shadow-2xl flex items-center gap-4 sm:gap-5 animate-in slide-in-from-bottom-10 border border-slate-700/50">
           <span className="flex items-center gap-2 font-bold text-sm sm:text-base whitespace-nowrap"><Volume2 size={20} className="text-amber-400 animate-pulse" /> {t.readChapter || '課文朗讀'} {chapterRepeatTimes > 1 ? `(${currentReadingRound} / ${chapterRepeatTimes})` : ''}</span>
           <div className="w-px h-6 bg-slate-600"></div>
           <button onClick={handlePauseToggle} className="text-amber-400 hover:text-amber-300 flex items-center gap-1.5 text-sm sm:text-base font-bold transition-colors whitespace-nowrap">{isPaused ? <><Play size={18} className="fill-current" /> 繼續</> : <><Pause size={18} className="fill-current" /> 暫停</>}</button>
           <div className="w-px h-6 bg-slate-600"></div>
           <button onClick={stopChapterReading} className="text-rose-400 hover:text-rose-300 flex items-center gap-1.5 text-sm sm:text-base font-bold transition-colors whitespace-nowrap"><StopCircle size={18} /> {t.stopReading || '停止'}</button>
        </div>
      )}

      {/* 更新日誌 (Change Log) Modal */}
      {isChangelogOpen && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-sm animate-in fade-in" onClick={() => setIsChangelogOpen(false)}>
          <div className="bg-white rounded-[2rem] p-6 md:p-8 w-full max-w-2xl max-h-[85vh] flex flex-col shadow-2xl relative animate-in zoom-in-95" onClick={e=>e.stopPropagation()}>
            <button onClick={() => setIsChangelogOpen(false)} className="absolute top-4 right-4 md:top-6 md:right-6 p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-full z-10"><X size={24} /></button>
            <div className="flex items-center justify-between mb-6 flex-shrink-0 pr-10 sm:pr-14">
              <h2 className="text-2xl md:text-3xl font-bold text-slate-800 flex items-center gap-3"><History className="text-indigo-500" size={28} /> <span className="hidden sm:inline">更新日誌 (Change Log)</span><span className="sm:hidden">更新日誌</span></h2>
              <button onClick={handleDownloadSource} className="flex items-center gap-1.5 px-3 py-1.5 sm:px-4 sm:py-2 bg-indigo-50 text-indigo-600 hover:bg-indigo-100 rounded-full font-bold text-xs sm:text-sm transition-colors shadow-sm border border-indigo-100 active:scale-95 flex-shrink-0" title="下載資料庫備份">
                <Download size={16} /> <span className="hidden sm:inline">下載資料庫</span>
              </button>
            </div>
            
            {/* 月份分頁 */}
            <div className="flex gap-2 overflow-x-auto pb-3 mb-4 hide-scrollbar border-b border-slate-100 flex-shrink-0">
              {logMonths.map(month => (
                <button 
                  key={month} 
                  onClick={() => setSelectedLogMonth(month)} 
                  className={`px-4 py-2 rounded-full whitespace-nowrap text-sm font-bold transition-all shadow-sm border ${currentLogMonth === month ? 'bg-indigo-500 text-white border-indigo-500' : 'bg-white text-slate-500 border-slate-200 hover:bg-slate-50 hover:text-indigo-600 hover:border-indigo-300'}`}
                >
                  {month}
                </button>
              ))}
            </div>
            
            {/* 日誌內容 */}
            <div className="space-y-6 overflow-y-auto pr-2 pb-4">
              {filteredLogs.map((log, idx) => (
                <div key={idx} className="border-b border-slate-100 pb-6 last:border-0 last:pb-0 animate-in fade-in slide-in-from-bottom-2">
                  <div className="flex flex-wrap items-baseline gap-3 mb-3">
                    <span className="bg-indigo-100 text-indigo-700 font-mono font-bold px-3 py-1 rounded-full text-sm">{log.version}</span>
                    <span className="text-slate-400 text-sm font-medium">{log.date} {log.time}</span>
                  </div>
                  <ul className="list-disc list-inside text-slate-600 space-y-1.5 ml-4">
                    {log.changes.map((change, cIdx) => (
                      <li key={cIdx} className="text-sm md:text-base leading-relaxed">{change}</li>
                    ))}
                  </ul>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
  </script>
</body>
</html>
